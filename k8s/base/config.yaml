apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-config
data:
  TASKFLOW_QUEUE_BACKEND: redis
  TASKFLOW_REDIS_URL: redis://redis:6379
  TASKFLOW_DATABASE_URL: postgresql+asyncpg://taskflow:taskflow@postgres:5432/taskflow
  TASKFLOW_LOG_LEVEL: INFO
  # Structured logs by default in a cluster - something is aggregating them.
  TASKFLOW_JSON_LOGS: "true"
  TASKFLOW_CORS_ORIGINS: http://taskflow.local
---
apiVersion: v1
kind: Secret
metadata:
  name: taskflow-secrets
type: Opaque
stringData:
  # Placeholder only. Real deployments should source this from a secret
  # manager (External Secrets, Sealed Secrets, cloud KMS) rather than a
  # manifest committed to git.
  TASKFLOW_API_KEYS: local-dev-key
  POSTGRES_PASSWORD: taskflow
