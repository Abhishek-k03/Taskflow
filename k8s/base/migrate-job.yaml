apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  annotations:
    # Re-run on each release; Alembic is idempotent when already at head.
    kustomize.toolkit.fluxcd.io/force: "true"
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: alembic
          image: taskflow-backend:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: taskflow-config
            - secretRef:
                name: taskflow-secrets
