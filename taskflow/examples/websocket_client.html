<!--
  examples/websocket_client.html

  Minimal WebSocket demo for TaskFlow.

  Start the stack first, from the repository root:
      docker compose up --build
  then open this file directly in a browser.

  The socket needs an API key. Browsers cannot set headers on a WebSocket,
  so it goes in a ?token= query parameter instead - without it the server
  rejects the handshake with 403 before the connection is ever established.
  Compose defaults the key to `local-dev-key`; edit API_KEY below if yours
  differs, or append ?token=<key> to this page's own URL.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>TaskFlow WebSocket Demo</title>
<style>
  body { font-family: monospace; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.1rem; }
  #status { font-weight: bold; }
  #status.connected { color: green; }
  #status.disconnected { color: red; }
  .row { margin: 0.5rem 0; }
  input { padding: 0.3rem; }
  button { padding: 0.3rem 0.8rem; margin-left: 0.3rem; }
  #log { border: 1px solid #ccc; height: 320px; overflow-y: auto; padding: 0.5rem; white-space: pre-wrap; font-size: 0.85rem; }
</style>
</head>
<body>
  <h1>TaskFlow WebSocket Demo</h1>
  <div class="row">Status: <span id="status" class="disconnected">disconnected</span></div>

  <div class="row">
    <input id="taskId" placeholder="task_id to subscribe to" size="40" />
    <button onclick="subscribe()">Subscribe</button>
    <button onclick="unsubscribe()">Unsubscribe</button>
    <button onclick="ping()">Ping</button>
  </div>

  <div id="log"></div>

  <script>
    // Taken from this page's own query string when present, so the key does
    // not have to be edited into the file: open the page as
    // websocket_client.html?token=your-key
    const API_KEY =
      new URLSearchParams(location.search).get("token") || "local-dev-key";
    const WS_URL =
      "ws://localhost:8000/ws?token=" + encodeURIComponent(API_KEY);
    const statusEl = document.getElementById("status");
    const logEl = document.getElementById("log");
    let ws;

    function log(message) {
      const line = document.createElement("div");
      line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function connect() {
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        statusEl.textContent = "connected";
        statusEl.className = "connected";
        // WS_URL carries the key, so log the path without the query string.
        log("Connected to " + WS_URL.split("?")[0]);
      };

      ws.onmessage = (event) => {
        log("Received: " + event.data);
      };

      ws.onclose = () => {
        statusEl.textContent = "disconnected";
        statusEl.className = "disconnected";
        log("Disconnected");
      };

      ws.onerror = (event) => {
        log("Error: " + JSON.stringify(event));
      };
    }

    function send(message) {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        log("Not connected");
        return;
      }
      ws.send(JSON.stringify(message));
      log("Sent: " + JSON.stringify(message));
    }

    function subscribe() {
      const taskId = document.getElementById("taskId").value.trim();
      if (!taskId) return;
      send({ type: "subscribe", task_id: taskId });
    }

    function unsubscribe() {
      const taskId = document.getElementById("taskId").value.trim();
      if (!taskId) return;
      send({ type: "unsubscribe", task_id: taskId });
    }

    function ping() {
      send({ type: "ping" });
    }

    connect();
  </script>
</body>
</html>
