apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Single replicas and no autoscaling: a local cluster has one node, so extra
# replicas only compete for the same CPU.
replicas:
  - name: api
    count: 1
  - name: worker
    count: 1
  - name: frontend
    count: 1

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: worker
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: worker
  - target:
      kind: PodDisruptionBudget
      name: api
    patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: api
  # Locally built images are not in a registry, so never go looking for one.
  #
  # IfNotPresent rather than Never, which is what this used to say. Never
  # assumes the image is already in the node's own image store, which is true
  # after `kind load docker-image` and false on Docker Desktop, where the
  # node pulls through a mirror that serves the host's images instead - every
  # pod there failed with ErrImageNeverPull. IfNotPresent works on both.
  #
  # Jobs are patched too. The migrate Job was missed by the Deployment-only
  # target and fell back to Kubernetes' default of Always for a :latest tag,
  # so it re-pulled on every run.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Job
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
