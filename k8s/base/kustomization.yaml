apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: taskflow

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: taskflow

resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - redis.yaml
  - api.yaml
  - worker.yaml
  - scheduler.yaml
  - frontend.yaml
  - migrate-job.yaml
  - ingress.yaml
