# Datastore host ports are overridable because a machine with Postgres or
# Redis already installed will silently win the binding: Windows lets both
# the native service and Docker's proxy listen on the same port, and
# connections to localhost then reach whichever got there first - so
# `psql localhost:5432` talks to the wrong database with no error to
# explain it. Set POSTGRES_PORT/REDIS_PORT to something free. Nothing
# inside the stack is affected; services reach each other over the compose
# network, on the container ports, which never change.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./taskflow
    ports:
      - "8000:8000"
    environment:
      <<: &backend_env
        TASKFLOW_QUEUE_BACKEND: redis
        TASKFLOW_REDIS_URL: redis://redis:6379
        TASKFLOW_DATABASE_URL: postgresql+asyncpg://taskflow:taskflow@postgres:5432/taskflow
        TASKFLOW_CORS_ORIGINS: http://localhost:3000
        # Demo value. In a real deployment this comes from a secret store,
        # never from a file in the repo.
        TASKFLOW_API_KEYS: ${TASKFLOW_API_KEYS:-local-dev-key}
      TASKFLOW_ROLE: api
    depends_on: &backend_deps
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: &backend_healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  worker:
    build:
      context: ./taskflow
    # Deliberately no host port: this is the service you scale
    # (`docker compose up --scale worker=3`), and a published port would
    # collide on the second replica.
    environment:
      <<: *backend_env
      TASKFLOW_ROLE: worker
    depends_on: *backend_deps
    healthcheck: *backend_healthcheck

  scheduler:
    build:
      context: ./taskflow
    # Normally one replica. A Redis leader lock means extra replicas stand
    # by rather than double-firing, which is what makes the overlap during a
    # rolling deploy safe.
    environment:
      <<: *backend_env
      TASKFLOW_ROLE: scheduler
    depends_on: *backend_deps
    healthcheck: *backend_healthcheck

  frontend:
    build:
      context: ./frontend
      args:
        TASKFLOW_BACKEND_URL: http://api:8000
        TASKFLOW_API_KEY: ${TASKFLOW_API_KEYS:-local-dev-key}
    ports:
      - "3000:3000"
    environment:
      TASKFLOW_BACKEND_URL: http://api:8000
      # The browser never receives this - the Next server attaches it when
      # proxying to the api, so enabling auth needs no client change.
      TASKFLOW_API_KEY: ${TASKFLOW_API_KEYS:-local-dev-key}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  redis_data:

# api, worker and scheduler are the same image running different roles, and
# they only work as separate containers because they share state rather than
# holding it: the queue is Redis, task events travel over Redis pub/sub, and
# periodic definitions live in Postgres. On the in-memory backend each
# container would get its own private queue and the api would accept tasks no
# worker could ever see.
#
# Run `make migrate` once before first use to create the Postgres schema.
