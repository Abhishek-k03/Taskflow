apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: frontend
          image: taskflow-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: TASKFLOW_BACKEND_URL
              value: http://api:8000
            # Attached to proxied requests server-side, so it never reaches
            # the browser.
            - name: TASKFLOW_API_KEY
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: TASKFLOW_API_KEYS
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            # `/` is a server-rendered route, not a static file, and the
            # default 1s timeout is not enough for the first render on a
            # cold process: on a live cluster this pod served in 127ms but
            # still took ~60s to pass readiness, failing the probe three
            # times over before its first render landed inside the second.
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
