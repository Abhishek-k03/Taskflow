services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./taskflow
    ports:
      - "8000:8000"
    environment:
      TASKFLOW_ROLE: all
      TASKFLOW_CORS_ORIGINS: http://localhost:3000
      TASKFLOW_DATABASE_URL: postgresql+asyncpg://taskflow:taskflow@postgres:5432/taskflow
      TASKFLOW_REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        TASKFLOW_BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    environment:
      TASKFLOW_BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  redis_data:

# Postgres backs dual-write persistence: queue writes go to both the backend's
# own store and Postgres (tasks + task_events), but every read still comes
# from the queue backend - see _persist_safely. Run `make migrate` to create
# the schema; the app works without it too, since dual-write is best-effort.
#
# Redis is running here, but the backend still defaults to the in-memory
# queue: TASKFLOW_QUEUE_BACKEND is deliberately not set to `redis` yet.
# Flipping it is what makes tasks survive a restart and lets api/worker/
# scheduler run as separate processes, so it is its own deliberate step with
# no in-memory fallback afterwards - not a side effect of adding the service.
# Until then, splitting the roles would give containers that start but share
# no queue, which is worse than not splitting them.
