apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

replicas:
  - name: api
    count: 3
  - name: worker
    count: 4
  - name: frontend
    count: 2

# Pinned tags rather than :latest, so a rollout is a deliberate change and
# a rollback is meaningful.
images:
  - name: taskflow-backend
    newName: registry.example.com/taskflow-backend
    newTag: "1.0.0"
  - name: taskflow-frontend
    newName: registry.example.com/taskflow-frontend
    newTag: "1.0.0"

patches:
  - target:
      kind: ConfigMap
      name: taskflow-config
    patch: |-
      - op: replace
        path: /data/TASKFLOW_CORS_ORIGINS
        value: https://taskflow.example.com
